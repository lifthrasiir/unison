[package]
name = "uniform"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu"] }
egui = "0.31"
tiny-skia = "0.11"
notify = "7"
anyhow = "1"
write-fonts = "0.50"
read-fonts = "0.41"
rfd = "0.15"
arboard = "3"
harfbuzz_rs = { version = "2", default-features = false, features = ["build-native-harfbuzz"] }
skrifa = "0.44"
png = "0.18"
unicode_names2 = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf2woff2 = { version = "0.13", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "20"
core-graphics = "0.23"
core-foundation = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_DirectWrite",
    "Win32_System_Com",
    "implement",
] }
windows-core = "0.58"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
