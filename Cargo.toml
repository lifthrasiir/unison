[package]
name = "uniform"
version = "0.1.0"
edition = "2024"

[features]
default = ["editor"]
editor = ["eframe", "egui", "tiny-skia", "notify", "rfd", "arboard", "embed-resource"]

[dependencies]
anyhow = "1"
write-fonts = "0.50"
read-fonts = "0.41"
rustybuzz = "0.20"
skrifa = "0.44"
png = "0.18"
unicode_names2 = "3.1"
unicode-normalization = "0.1.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf2woff2 = { version = "0.13", default-features = false }

eframe = { version = "0.31", default-features = false, features = ["wgpu"], optional = true }
egui = { version = "0.31", optional = true }
tiny-skia = { version = "0.11", optional = true }
notify = { version = "7", optional = true }
rfd = { version = "0.15", optional = true }
arboard = { version = "3", optional = true }
unicode-script = "0.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
core-text = "20"
core-graphics = "0.23"
core-foundation = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_DirectWrite",
    "Win32_System_Com",
    # app/watch.rs: GetDriveTypeW + DRIVE_REMOTE, to tell a network share from a local disk
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
    "implement",
] }
windows-core = "0.58"

[build-dependencies]
embed-resource = { version = "3", optional = true }

[dev-dependencies]

# Line tables only: enough for panic backtraces to name functions and
# source lines, without the size and build-time cost of full debug info.
[profile.release]
debug = "line-tables-only"
