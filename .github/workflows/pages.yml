name: Deploy to GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      - name: Build font and samples
        run: make CARGOFLAGS="-r --no-default-features"

      - name: Prepare pages directory
        run: |
          mkdir _site
          cp index.html live.html sample.html sample.png unison.ttf unison.woff2 _site/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unison-font
          path: |
            unison.ttf
            unison.woff2

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download font artifacts
        uses: actions/download-artifact@v4
        with:
          name: unison-font

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            unison.ttf
            unison.woff2
