name: Deploy to GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_outcome: ${{ steps.build.outcome }}
      assertions_outcome: ${{ steps.assertions.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      # `uniform build` writes every output file even when it reports errors,
      # and then exits non-zero. The deployment below is still worth doing --
      # the files exist and are mostly right -- so the failure is carried to the
      # `report` job instead of stopping this one. Same for the assertions.
      - name: Build font and samples
        id: build
        continue-on-error: true
        run: make CARGOFLAGS="-r --no-default-features" WOFF2QUALITY=max

      - name: Run shape assertions
        id: assertions
        continue-on-error: true
        run: make test CARGOFLAGS="-r --no-default-features"

      - name: Check the outputs exist
        run: |
          for f in index.html demo.html live.html sample.html sample.png unison.ttc unison-*.woff2; do
            test -s "$f" || { echo "::error::$f was not produced"; exit 1; }
          done

      - name: Prepare pages directory
        run: |
          mkdir _site
          cp index.html demo.html live.html sample.html sample.png unison.ttc unison-*.woff2 _site/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unison-font
          path: |
            unison.ttf
            unison.woff2

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The last word on the run. Deployment has already happened by this point;
  # this job exists so a run whose font reported errors still shows up red.
  report:
    needs: [build, deploy]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report font build errors
        run: |
          status=0
          if [ "${{ needs.build.outputs.build_outcome }}" != "success" ]; then
            echo "::error::The font build reported errors (see the 'Build font and samples' step). The deployed files were still published, but they are missing whatever those errors dropped."
            status=1
          fi
          if [ "${{ needs.build.outputs.assertions_outcome }}" != "success" ]; then
            echo "::error::Shape assertions failed (see the 'Run shape assertions' step)."
            status=1
          fi
          if [ $status -eq 0 ]; then echo "Font built and asserted cleanly."; fi
          exit $status

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download font artifacts
        uses: actions/download-artifact@v4
        with:
          name: unison-font

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            unison.ttf
            unison.woff2
